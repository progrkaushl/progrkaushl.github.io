{% for section in blurb %}
    <div class="category">
        <span class="category-label">{{ section.category }}</span>
        <div class="skill-tags">
        {% if section.primary %}
            {% for skill in section.primary %}
                <span class="tag tag-primary">{{ skill }}</span>
            {% endfor %}
        {% endif %}
        {% if section.secondary %}
            {% for skill in section.secondary %}
                <span class="tag tag-secondary">{{ skill }}</span>
            {% endfor %}
        {% endif %}
        </div>
    </div>
{% endfor %}
